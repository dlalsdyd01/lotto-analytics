<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0c11">
    <meta name="google-adsense-account" content="ca-pub-3398247421662455">
    <meta name="naver-site-verification" content="84c152c080fb1e302e45d57a3e2657418b707042" />
    <title>{% block title %}Lotto Lab - 로또 번호 예측{% endblock %}</title>
    <meta name="description" content="{% block description %}역대 로또 6/45 당첨 데이터 기반 이번 주 로또 예측번호 생성기{% endblock %}">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.description() }}">
    <meta property="og:url" content="https://lottoanalytics.co.kr{{ request.path }}">
    <meta property="og:site_name" content="Lotto Lab">
    <meta property="og:image" content="https://lottoanalytics.co.kr/static/img/og-image.svg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="canonical" href="https://lottoanalytics.co.kr{{ request.path }}">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=17">
    {% block head_extra %}{% endblock %}

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3398247421662455" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-925QJ7TR52"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-925QJ7TR52');
    </script>
</head>
<body>
<header class="header">
    <div class="wrap header-inner">
        <a href="/" class="logo"><span class="logo-mark" aria-hidden="true"></span>LOTTO<span>LAB</span></a>
        <span class="header-tag">로또 6/45 예측번호</span>
    </div>
</header>

<main class="wrap">
{% block body %}{% endblock %}
</main>

<footer class="footer">
    <div class="wrap">
        <nav class="footer-links">
            <a href="/">홈</a>
            <a href="/privacy">개인정보처리방침</a>
            <a href="/terms">이용약관</a>
            <a href="/contact">연락처</a>
        </nav>
        <p>로또는 완전한 무작위 추첨이며, 본 사이트의 번호는 참고용으로 당첨을 보장하지 않습니다.<br>
        도박 문제 상담: 한국도박문제예방치유원 ☎ 1336 · &copy; 2024-2026 Lotto Lab</p>
    </div>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
